<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>森、道、市場 2026 ガイド</title>
<meta name="description" content="森、道、市場2026の非公式ガイドアプリ。会場マップ・出店・タイムテーブル・出演者をすぐに確認。">
<meta name="theme-color" content="#de1815">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="森道2026">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700;800&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <div class="app-header__top">
    <div class="app-header__title">
      森、道、市場 <span class="mark en">2026</span>
    </div>
    <div class="app-header__right">
      <button class="icon-btn" id="nightBtn" aria-label="表示モード切替">🌙</button>
      <div class="app-header__clock en" id="clock">--:--</div>
    </div>
  </div>
  <div class="day-tabs" id="dayTabs"></div>
</header>

<main>
  <section class="view pad" id="view-home"></section>
  <section class="view pad" id="view-map"></section>
  <section class="view pad" id="view-timetable"></section>
  <section class="view pad" id="view-artists"></section>
  <section class="view pad" id="view-shops"></section>
  <section class="view pad" id="view-myplan"></section>
</main>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalBody"></div>
</div>

<nav class="tabbar">
  <button data-view="home"><span class="ico">🏠</span><span class="lbl">ホーム</span></button>
  <button data-view="map"><span class="ico">🗺️</span><span class="lbl">マップ</span></button>
  <button data-view="timetable"><span class="ico">🕒</span><span class="lbl">タイテ</span></button>
  <button data-view="artists"><span class="ico">🎤</span><span class="lbl">出演者</span></button>
  <button data-view="shops"><span class="ico">🛍️</span><span class="lbl">出店</span></button>
  <button data-view="myplan"><span class="ico">⭐</span><span class="lbl">マイ</span></button>
</nav>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
/* Service Worker 登録。コードはネットワーク優先のため、次回読み込み時に
   自動で最新化される（操作中の強制リロードはしない）。 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
