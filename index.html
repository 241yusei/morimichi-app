<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>森、道、市場 2026 ガイド</title>
<meta name="description" content="森、道、市場2026の非公式ガイドアプリ。会場マップ・出店・タイムテーブル・出演者をすぐに確認。">
<meta name="theme-color" content="#de1815">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="森道2026">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="icon" type="image/png" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
<!-- Webフォントは非同期読み込み（弱回線で描画をブロックしない。
     未取得時はシステムフォントで表示される） -->
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700;800&family=Montserrat:wght@700;800&display=swap">
<noscript><link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700;800&family=Montserrat:wght@700;800&display=swap"></noscript>
</head>
<body>

<header class="app-header">
  <div class="app-header__top">
    <div class="app-header__title">
      森、道、市場 <span class="mark en">2026</span>
      <span class="unofficial-tag">非公式ファンアプリ</span>
    </div>
    <div class="app-header__right">
      <button class="icon-btn" id="nightBtn" aria-label="表示モード切替">🌙</button>
      <div class="app-header__clock en" id="clock">--:--</div>
    </div>
  </div>
  <div class="day-tabs" id="dayTabs"></div>
  <div class="marquee" role="status" aria-live="polite">
    <div class="marquee__track">
      <span class="marquee__text">森道市場2026終了。参加者・出展者・アーティスト・運営のみなさまお疲れ様でした。明日から森道ロスで頑張りましょう。</span>
      <span class="marquee__text" aria-hidden="true">森道市場2026終了。参加者・出展者・アーティスト・運営のみなさまお疲れ様でした。明日から森道ロスで頑張りましょう。</span>
    </div>
  </div>
</header>

<main>
  <section class="view pad" id="view-home"></section>
  <section class="view pad" id="view-map"></section>
  <section class="view pad" id="view-timetable"></section>
  <section class="view pad" id="view-artists"></section>
  <section class="view pad" id="view-shops"></section>
  <section class="view pad" id="view-myplan"></section>
</main>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalBody" role="dialog" aria-modal="true" aria-label="詳細"></div>
</div>

<nav class="tabbar">
  <button data-view="home"><span class="ico">🏠</span><span class="lbl">ホーム</span></button>
  <button data-view="artists"><span class="ico">🎤</span><span class="lbl">出演者</span></button>
  <button data-view="myplan" class="tabbar__center"><span class="ico">⭐</span><span class="lbl">わたしの森道</span></button>
  <button data-view="shops"><span class="ico">🛍️</span><span class="lbl">出店</span></button>
  <button data-view="map"><span class="ico">🗺️</span><span class="lbl">マップ</span></button>
</nav>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
/* Service Worker 登録。
   - 初回訪問: コントローラ無し → controllerchange でのリロードはしない。
   - 2回目以降: 既存コントローラあり → 新しい SW が有効化されたら
     一度だけリロードし、修正を確実に反映する。
   - アプリ復帰時に update() を叩き、最新版を取りに行く。 */
if ('serviceWorker' in navigator) {
  var hadController = !!navigator.serviceWorker.controller;
  var refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadController || refreshing) return;
    refreshing = true;
    window.location.reload();
  });
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) {
          try { var p = reg.update(); if (p && p.catch) p.catch(function () {}); }
          catch (e) {}
        }
      });
    }).catch(function () {});
  });
}
</script>
</body>
</html>
